{% extends 'recomendations/base.html' %}

{% block content %}
<div class="auth-wrapper d-flex align-items-center justify-content-center" style="min-height: 90vh; padding: 60px 0;">
    <div class="auth-card reveal-on-scroll">
        <!-- Window Header Bar -->
        <div class="window-header-bar d-flex justify-content-between align-items-center">
            <div class="header-label">SYSTEM_AUTH // LOGIN_ACCESS</div>
            <div class="window-controls">
                <a href="{% url 'homepage' %}" class="vintage-btn text-decoration-none" style="padding: 2px 15px;">
                    < </a>
            </div>
        </div>

        <div class="window-content p-4 p-md-5">
            <div class="text-center mb-5">
                <h2 class="fw-bold text-white mb-2" style="letter-spacing: -1px; font-family: 'Satoshi', sans-serif;">
                    Selamat Datang</h2>
                <p class="text-muted small text-uppercase"
                    style="letter-spacing: 2px; font-family: 'Lores', sans-serif;"></p>
            </div>

            <form method="POST" class="auth-form">
                {% csrf_token %}

                {% for field in form %}
                <div class="form-group mb-4">
                    <label class="mb-2 d-block">
                        > {{ field.label|upper }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                    <div class="text-danger small mt-2" style="font-family: 'Lores', sans-serif;">
                        [ERROR]: {{ field.errors|striptags }}
                    </div>
                    {% endif %}
                </div>
                {% endfor %}

                <button type="submit" class="btn-modular-cta w-100 py-3 mt-3 border-0">
                    AKSES SISTEM
                </button>
            </form>

            <div class="text-center mt-5">
                <p class="text-muted small mb-0">Belum memiliki akun?
                    <a href="{% url 'register' %}" class="fw-bold text-decoration-none"
                        style="color: #4af626;">DAFTAR</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
